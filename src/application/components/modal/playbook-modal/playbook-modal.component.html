<app-modal (closed)="closed.emit()">
    <div class="panel">
        <h3>{{ title() }}</h3>
        <p>{{ data().intro }}</p>
        <hr>
        <h5>Gameplay</h5>
        <div class="details" [innerHTML]="data().ruleset"></div>
        <hr>
        <h5>Scoring</h5>
        <div class="details" [innerHTML]="data().scoreguide"></div>
        @if (data().notes) {
        <hr>
        <h5>Notes</h5>
        <div class="details" [innerHTML]="data().notes"></div>
        }
    </div>
</app-modal>
