<div class="wrapper" (mouseleave)="openned.set(false)">
    <div class="bar">
        <svg class="badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
            <path d="M781.69-136.92 530.46-388.16q-30 24.77-69 38.77-39 14-80.69 14-102.55 0-173.58-71.01-71.03-71.01-71.03-173.54 0-102.52 71.01-173.6 71.01-71.07 173.54-71.07 102.52 0 173.6 71.03 71.07 71.07 71.07 173.58 0 42.85-14.38 81.85-14.39 39-38.39 67.84l251.23 251.23-42.15 42.16Z
                M380.77-395.38q77.31 0 130.96-53.66 53.66-53.65 53.66-130.96t-53.66-130.96q-53.65-53.66-130.96-53.66t-130.96 53.66Q196.15-657.31 196.15-580t53.66 130.96q53.65 53.66 130.96 53.66Z" />
        </svg>

        <div class="chips">
            @for (term of terms(); track term; let i = $index) {
            <span>
                {{ term }}
                <button (click)="removeTerm(i)">&#10006;</button>
            </span>
            }
            <input #term id="keywords" type="text" placeholder="Search..."
                (keydown.enter)="addTerm(term.value); term.value = ''"
                (keydown.backspace)="term.value === '' ? removeLastTerm() : null" />
        </div>

        @if (filters()) {
        <div class="divider"></div>
        <button class="icon" [class.active]="openned()" (click)="openned.update(value => !value)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path d="M206.92-170v-282.31h-80v-60h220v60h-80V-170h-60Z
                    m0-437.69V-790h60v182.31h-60Z
                    m163.08 0v-60h80V-790h60v122.31h80v60H370Z
                    M450-170v-342.31h60V-170h-60Z
                    m243.08 0v-122.31h-80v-60h220v60h-80V-170h-60Z
                    m0-277.69V-790h60v342.31h-60Z" />
            </svg>
            Filters
            @if (filterCount() > 0) {
            <span>{{ filterCount() }}</span>
            }
        </button>
        }
    </div>

    @if (openned()) {
    <div class="popover">
        @for (item of filters(); track item) {
        <div class="group">
            <h6>{{ item.heading }}</h6>
            @if (item.type === 'check') {
            <div class="pills">
                @for (option of item.options; track option) {
                <button [class.active]="option.active" (click)="toggleOption(item, option)">
                    {{ option.label }}
                </button>
                }
            </div>
            } @else {
            <div class="dates">
                <input #fromDate id="from-date" type="datetime-local" [value]="item.from"
                    (change)="selectDate(item, 'start', fromDate.value)">
                <span>to</span>
                <input #toDate id="end-date" type="datetime-local" [value]="item.to"
                    (change)="selectDate(item, 'end', toDate.value)">
            </div>
            }
        </div>
        }
        <button class="clear" (click)="clearFilters()">Clear all</button>
    </div>
    }
</div>
